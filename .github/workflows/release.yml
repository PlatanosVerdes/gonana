name: Release

# Tests every change; on main, tags the next patch so callers can `go get` it.

on:
  push:
    branches: [main]
    # An icon or a README is not a new version.
    paths-ignore: ["assets/**", "**/*.md"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...

  tag:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the next patch
        run: |
          last=$(git tag --list 'v0.*' --sort=-v:refname | head -1)
          if [ -z "$last" ]; then next=v0.1.0; else
            IFS=. read -r major minor patch <<<"${last#v}"
            next="v$major.$minor.$((patch + 1))"
          fi
          git tag "$next"
          git push origin "$next"
          echo "Tagged $next" >> "$GITHUB_STEP_SUMMARY"
